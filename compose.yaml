name: memscope-b05

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  memory-api:
    image: memscope/memory-api:0.0.0-b05
    build:
      context: .
      dockerfile: docker/memory-api/Dockerfile
      args:
        PIP_INDEX_URL: "${B04_PIP_INDEX_URL:-https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-center/}"
        PIP_EXTRA_INDEX_URL: "${B04_PIP_EXTRA_INDEX_URL:-https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-central-repo/simple/ https://cmc.centralrepo.rnd.huawei.com/artifactory/product_pypi/simple/}"
        PIP_TRUSTED_HOST: "${B04_PIP_TRUSTED_HOST:-cmc.centralrepo.rnd.huawei.com}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: "${B05_MEMORY_API_MEMORY_LIMIT:-512m}"
    cpus: "${B05_MEMORY_API_CPU_LIMIT:-1.0}"
    pids_limit: 256
    logging: *default-logging
    depends_on:
      memos:
        condition: service_healthy
        restart: true
    environment:
      APP_PROFILE: memos_add
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: json
      CONTEST_AUTH_MODE: "${CONTEST_AUTH_MODE:-none}"
      CONTEST_API_KEY: "${CONTEST_API_KEY:-}"
      DATABASE_PATH: /var/lib/memscope/raw.db
      MEMOS_GATEWAY_RECEIPT_PATH: /var/lib/memscope/gateway-receipts.db
      SQLITE_BUSY_TIMEOUT_MS: "5000"
      MEMOS_BASE_URL: http://memos:8000
      ADD_DEADLINE_SECONDS: "${ADD_DEADLINE_SECONDS:-115}"
      ADD_WARN_SECONDS: "${ADD_WARN_SECONDS:-105}"
      MEMOS_DEADLINE_RESERVE_SECONDS: "${MEMOS_DEADLINE_RESERVE_SECONDS:-5}"
      MEMOS_CONNECT_TIMEOUT_SECONDS: "${MEMOS_CONNECT_TIMEOUT_SECONDS:-3}"
      MEMOS_RESPONSE_MAX_BYTES: "${MEMOS_RESPONSE_MAX_BYTES:-1048576}"
      SEARCH_DEADLINE_SECONDS: "${SEARCH_DEADLINE_SECONDS:-55}"
      SEARCH_WARN_SECONDS: "${SEARCH_WARN_SECONDS:-50}"
      MEMOS_SEARCH_MODE: "${MEMOS_SEARCH_MODE:-fast}"
      MEMOS_SEARCH_RELATIVITY: "${MEMOS_SEARCH_RELATIVITY:-0.0}"
      MEMOS_SEARCH_DEDUP: "${MEMOS_SEARCH_DEDUP:-exact}"
      MEMOS_SEARCH_RERANK: "${MEMOS_SEARCH_RERANK:-true}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2);
          assert r.status==200 and json.load(r)=={'status':'ok'}
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${MEMSCOPE_PUBLIC_PORT:-8080}:8080"
    volumes:
      - memscope_data:/var/lib/memscope
    networks:
      - backend

  neo4j:
    image: neo4j:5.26.6-community@sha256:eef89955a0ff6ce578ec5fb264333818bb2f56e169bcb8dda5bcadad1fc48893
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: "${B04_NEO4J_MEMORY_LIMIT:-2g}"
    cpus: "${B04_NEO4J_CPU_LIMIT:-2.0}"
    pids_limit: 512
    logging: *default-logging
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in an env file}"
      NEO4J_dbms_usage__report_enabled: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}"
          "RETURN 1 AS ready;" >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.15.3@sha256:31407c0e8e32eb771b71718f1a4772e2ad47a07557917b21ac96792f40eb8007
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: "${B04_QDRANT_MEMORY_LIMIT:-2g}"
    cpus: "${B04_QDRANT_CPU_LIMIT:-2.0}"
    pids_limit: 512
    logging: *default-logging
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

  memos:
    image: memscope/memos:2.0.32-b05
    build:
      context: .
      dockerfile: docker/memos/Dockerfile
      args:
        PIP_INDEX_URL: "${B04_PIP_INDEX_URL:-https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-center/}"
        PIP_EXTRA_INDEX_URL: "${B04_PIP_EXTRA_INDEX_URL:-https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-central-repo/simple/ https://cmc.centralrepo.rnd.huawei.com/artifactory/product_pypi/simple/}"
        PIP_TRUSTED_HOST: "${B04_PIP_TRUSTED_HOST:-cmc.centralrepo.rnd.huawei.com}"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: "${B04_MEMOS_MEMORY_LIMIT:-4g}"
    cpus: "${B04_MEMOS_CPU_LIMIT:-4.0}"
    pids_limit: 512
    logging: *default-logging
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true
      qdrant:
        condition: service_healthy
        restart: true
    environment:
      MEMSCOPE_MODEL_PROFILE: "${MEMSCOPE_MODEL_PROFILE:?set MEMSCOPE_MODEL_PROFILE to gateway or mock}"
      MEMSCOPE_ALLOW_INSECURE_MODEL_HTTP: "${MEMSCOPE_ALLOW_INSECURE_MODEL_HTTP:-false}"
      FILE_LOCAL_PATH: /var/lib/memos/files
      MEMOS_BASE_PATH: /var/lib/memos
      GRAPH_DB_BACKEND: neo4j-community
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in an env file}"
      NEO4J_DB_NAME: neo4j
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:?set EMBEDDING_DIMENSION}"
      MOS_EMBEDDER_BACKEND: universal_api
      MOS_EMBEDDER_PROVIDER: openai
      MOS_EMBEDDER_API_BASE: "${MOS_EMBEDDER_API_BASE:?set MOS_EMBEDDER_API_BASE}"
      MOS_EMBEDDER_API_KEY: "${MOS_EMBEDDER_API_KEY:?set MOS_EMBEDDER_API_KEY}"
      MOS_EMBEDDER_MODEL: "${MOS_EMBEDDER_MODEL:?set MOS_EMBEDDER_MODEL}"
      MOS_EMBEDDER_TIMEOUT: "${MOS_EMBEDDER_TIMEOUT:-5}"
      MOS_EMBEDDER_BACKUP_CLIENT: "false"
      MOS_CHAT_MODEL_PROVIDER: openai
      MOS_CHAT_MODEL: "${MEMRADER_MODEL:?set MEMRADER_MODEL}"
      OPENAI_API_BASE: "${MEMRADER_API_BASE:?set MEMRADER_API_BASE}"
      OPENAI_API_KEY: "${MEMRADER_API_KEY:?set MEMRADER_API_KEY}"
      MEMRADER_API_BASE: "${MEMRADER_API_BASE:?set MEMRADER_API_BASE}"
      MEMRADER_API_KEY: "${MEMRADER_API_KEY:?set MEMRADER_API_KEY}"
      MEMRADER_MODEL: "${MEMRADER_MODEL:?set MEMRADER_MODEL}"
      MEMRADER_TIMEOUT_SECONDS: "${MEMRADER_TIMEOUT_SECONDS:-110}"
      MEM_READER_BACKEND: simple_struct
      MEM_READER_TOKENIZER: word
      MEM_READER_CHAT_WINDOW_MAX_TOKENS: "${MEM_READER_CHAT_WINDOW_MAX_TOKENS:-1024}"
      MEM_READER_REMOVE_PROMPT_EXAMPLE: "${MEM_READER_REMOVE_PROMPT_EXAMPLE:-false}"
      SIMPLE_STRUCT_ADD_FILTER: "false"
      MEM_READER_SAVE_RAWFILENODE: "false"
      FAST_GRAPH: "false"
      BM25_CALL: "false"
      VEC_COT_CALL: "false"
      FULLTEXT_CALL: "false"
      MOS_RERANKER_BACKEND: cosine_local
      MOS_FEEDBACK_RERANKER_BACKEND: cosine_local
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ENABLE_CHAT_API: "false"
      ENABLE_INTERNET: "false"
      ENABLE_ACTIVATION_MEMORY: "false"
      ENABLE_PREFERENCE_MEMORY: "false"
      ENABLE_DINGDING_BOT: "false"
      MOS_ENABLE_SCHEDULER: "false"
      API_SCHEDULER_ON: "false"
      MOS_ENABLE_REORGANIZE: "false"
      MEMSCHEDULER_USE_REDIS_QUEUE: "false"
      MOS_ENABLE_DEFAULT_CUBE_CONFIG: "true"
      NACOS_ENABLE_WATCH: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3);
          assert r.status == 200 and json.load(r).get('status') == 'healthy'
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
    volumes:
      - memos_data:/var/lib/memos
    networks:
      - backend
      - model-egress

networks:
  backend:
    internal: true
  model-egress:

volumes:
  memscope_data:
  memos_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
